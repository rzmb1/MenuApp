apiVersion: batch/v1
kind: Job
metadata:
  name: app-fill-demo-data
spec:
  template:
    spec:
      containers:
      - name: fill-demo-data
        image: htldevzone.azurecr.io/5ahif/team-a/backend:main
        imagePullPolicy: Always
        command: ["npm",  "run", "fill-demo-data"]
        env:
          - name: MONGODB_CONNECTION_STRING
            value: "mongodb://mongo-service/db"        
      restartPolicy: Never
  backoffLimit: 4
